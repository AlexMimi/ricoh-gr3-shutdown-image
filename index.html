="300" font-size="24" textLength="460" lengthAdjust="spacingAndGlyphs">Today : 0000004 &gt; Total: 0005492</text><text id="previewFirmware" x="637" y="426" text-anchor="end" fill="white" font-family="Helvetica Neue, Arial, sans-serif" font-weight="300" font-size="22" textLength="146" lengthAdjust="spacingAndGlyphs">FW Ver.1.60</text></svg></div></div><label class="overlay-toggle"><input type="checkbox" id="showOverlay" checked><span data-i18n="overlayLabel"></span></label><p class="hint" data-i18n="overlayNote"></p><p id="meta" class="hint"></p><label for="upload" data-i18n="uploadLabel"></label><input id="upload" type="file" accept="image/jpeg,image/png,image/webp"><label for="fit" data-i18n="fitLabel"></label><select id="fit"><option value="contain">底部留黑</option><option value="cover" selected>底部填满</option></select><div class="row"><button id="defaultButton" class="secondary" data-i18n="defaultButton"></button></div><button id="download" class="primary" data-i18n="download"></button><p id="status" role="status"></p></section><aside class="panel"><h2 id="instructionsTitle" data-i18n="instructionsTitle"></h2><p id="prep" data-i18n="prep"></p><ol class="steps"><li id="step1" data-i18n="step1"></li><li id="step2" data-i18n="step2"></li><li id="step3" data-i18n="step3"></li><li id="step4" data-i18n="step4"></li></ol><details id="disableDetails"><summary data-i18n="disableSummary"></summary><p id="disableText" data-i18n="disableText"></p><button class="secondary" id="disableButton" data-i18n="disableButton"></button></details><details id="restoreDetails"><summary data-i18n="restoreSummary"></summary><p class="hint" id="restoreDescription"></p><button class="secondary" id="restoreButton" data-i18n="restoreButton"></button><details id="stockRestore"><summary data-i18n="stockSummary"></summary><p id="stockText" data-i18n="stockText"></p><button class="secondary" id="stockButton" data-i18n="stockButton"></button></details></details><details><summary data-i18n="checkSummary"></summary><p id="checkText" data-i18n="checkText"></p><label for="readback" data-i18n="checkLabel"></label><input id="readback" type="file" accept="image/jpeg"><p id="checkStatus" role="status"></p></details></aside></div><footer><div class="footer-brand">Holowave<sup class="brand-registered">®</sup></div><span id="footerText" data-i18n="footerText"></span></footer></main><script>/* Local package generator. No firmware binary is included. */
(function (scope) {
  'use strict';
  const SIZE = 7264, W = 720, H = 480;
  const TARGET = 'B:\\Resource\\Jpeg\\GoodBye.jpg';
  const BACKUP = 'B:\\Resource\\Jpeg\\G20OLD.JPG';
  const utf8 = s => new TextEncoder().encode(s);
  function jpegInfo(b) {
    if (b[0] !== 255 || b[1] !== 216) throw Error('请选择 JPEG 图片。');
    let i = 2;
    while (i < b.length) {
      if (b[i++] !== 255) throw Error('JPEG 文件头不完整。');
      while (b[i] === 255) i++;
      const marker = b[i++];
      if (marker === 217 || marker === 218) break;

      if (n < 2 || i + n > b.length) throw Error('JPEG 数据长度异常。');

  }

    if (!scope.crypto?.subtle) throw Error('请使用最新版 Chrome、Edge 或 Safari 打开此工具。');
    return Array.from(new Uint8Array(await scope.crypto.subtle.digest('SHA-256',b)),x=>x.toString(16).padStart(2,'0')).join('');
  }
  function stop(log, message) {
    return [`filecreate f 'C:\\${log}'`,`filewriteln f '${message}'`,'fileclose f','exit'];
  }
  function sizeGuard(path, log) {
    return ['n = -1',`filestat '${path}' n`,'if n <> 7264 then',...stop(log,'BAD_SIZE_NO_REPLACEMENT'),'endif'];
  }
  function payload(b) {
    const lines = [], simulated = new Uint8Array(SIZE);
    let i = 0;
    while (i < b.length) {
      if (!b[i]) {i++; continue;}
      const start = i;
      while (i < b.length && b[i] && i-start < 32) i++;
      const values = b.subarray(start,i);
      lines.push(`fileseek f ${start} 0`,`filewrite f ${Array.from(values,x=>'#'+x).join('')}`);
      simulated.set(values,start);
    }
    if (!b.every((x,i)=>x===simulated[i])) throw Error('脚本数据重建校验失败。');
    return lines;
  }
  function build(b, hash, mode='install') {
    validate(b);
    if (!/^[a-f0-9]{64}$/.test(hash) || !['install','restore'].includes(mode)) throw Error('参数异常。');
    const src = `B:\\Resource\\Jpeg\\G${hash.slice(0,7).toUpperCase()}.JPG`;
    const log = mode === 'install' ? 'G20LOG.TXT' : 'RESTLOG.TXT';
    const lines = ['; GR IIIx ordinary version, official firmware 1.60.',`; JPEG SHA256 ${hash}`,...sizeGuard(TARGET,log)];
    if (mode==='install') {
      lines.push(`filecopy '${TARGET}' 'C:\\G20BEFR.JPG'`,`filesearch '${BACKUP}'`,'if result = 0 then',`filecopy '${TARGET}' '${BACKUP}'`,'endif',...sizeGuard(BACKUP,log),`filecopy '${BACKUP}' 'C:\\G20BACK.JPG'`,...sizeGuard('C:\\G20BACK.JPG',log));
    }
    // Only the image-hash-named scratch resource is refreshed. The target and backup are never deleted.
    lines.push(`filesearch '${src}'`,'if result = 1 then',`filedelete '${src}'`,'endif',`filesearch '${src}'`,'if result <> 0 then',...stop(log,'SCRATCH_EXISTS_NO_REPLACEMENT'),'endif',`filecreate f '${src}'`,'if f < 0 then',...stop(log,'CREATE_FAILED_NO_REPLACEMENT'),'endif','fileclose f',`filetruncate '${src}' 7264`,...sizeGuard(src,log),`fileopen f '${src}' 0`,'if f < 0 then',...stop(log,'OPEN_FAILED_NO_REPLACEMENT'),'endif',...payload(b),'fileclose f',`filecopy '${src}' 'C:\\G20BUILD.JPG'`,...sizeGuard('C:\\G20BUILD.JPG',log),`filecopy '${src}' '${TARGET}'`,'wr = result',`filecopy '${TARGET}' 'C:\\${mode==='install'?'G20DONE':'RESTCHK'}.JPG'`,'rd = result',`filecreate f 'C:\\${log}'`,'int2str s wr','filewriteln f s','int2str s rd','filewriteln f s',"filewriteln f 'END'",'fileclose f','exit');
    if (lines.some(x=>x.length>160)) throw Error('脚本行长度异常。');
    return lines.join('\r\n')+'\r\n';
  }
  const check = ["; Internal resources are read only.",`filecopy '${TARGET}' 'C:\\G20PERS.JPG'`,'exit'].join('\r\n')+'\r\n';
  const restoreBackup = [...sizeGuard(BACKUP,'RESTLOG.TXT'),`filecopy '${BACKUP}' '${TARGET}'`,`filecopy '${TARGET}' 'C:\\RESTCHK.JPG'`,'exit'].join('\r\n')+'\r\n';
  const backupOnly = [`filecopy '${TARGET}' 'C:\\G20BACK.JPG'`,'exit'].join('\r\n')+'\r\n';
  const readme = `GR IIIx 1.60 普通版关机画面修改\n\n适用范围：普通版 GR IIIx 官方1.60；HDF/Urban/GR III及其他版本未实测，不能当作通用包。\n\n1. 只将 00-entry 中的两个文件复制到SD根目录。卡上不能有旧 startup.ttl 或固件升级BIN。按MENU+电源开机，将 FW Setting1 的 Script 改为 Enable，正常关机。\n2. 将 01-install/script 复制到SD根目录，最终路径是 script/startup.ttl。一次只放一个启动脚本。\n3. 正常开机（不按MENU），等待30秒再关机，观察新画面。\n4. 将卡接电脑，把 G20BACK.JPG 保存到电脑。用离线工具校验 G20DONE.JPG：必须与生成的新图完全一致；只看日志0或文件尺寸不能证明成功。撤下 script/startup.ttl。\n5. 相机关机后取出电池30秒，再正常开关机确认画面仍在。需要完整读回时，只部署02-check里的script，开关机后用工具校验G20PERS.JPG，再撤脚本。\n6. 保留入口文件，按MENU+电源进工厂菜单，将Script改回Disable，关机。最后删除入口的两个文件和剩余测试脚本。\n\n恢复：03-restore-backup使用机内初始备份G20OLD.JPG，需要重新启用Script。若机内备份不存在，可用离线工具选择自己保存的G20BACK.JPG生成恢复包；不要重压缩备份。恢复后核对RESTCHK.JPG与自己的原图完全一致，撤脚本并关闭Script。恢复流程尚未实机执行。\n\n原理：图片嵌入TTL；先在B:独立文件中零初始化和写入，再B→B完整复制。此固件C:源filecopy曾生成空目标，直接逐段覆盖还会遗留旧零字节位置；本包避开这两种失败方式。\n\n本包不含修改版固件，不含他人的原机图片。核心流程在一台普通版GR IIIx 1.60已实测；这份重新整合的分享包尚未再次上机执行。图片生成器的浏览器交互检查因连接失败未完成。自定义图片未逐一实测，后续官方升级是否保留未验证。\n`;
  const compat = `兼容性核对（2026-10-04）\n普通GR IIIx 1.60：本次已实测替换、显示、断电保留和完整读回。\nGR IIIx HDF 1.60：官方共用同一升级包，工厂接口存在于同一固件，但此修改尚未实机验证；当前不列为已支持。\nGR IIIx Urban 1.60：官方共用固件，但特别版可能选择GB_Urban.jpg，不能套普通版目标。\nGR III普通/HDF/Street/Diary：官方共用GR III 2.10固件，属于另一份固件，入口及资源需要单独分析；此包不支持。\n官方资料：https://www.ricoh-imaging.co.jp/english/support/digital/gr3x_s.html 和 https://www.ricoh-imaging.co.jp/english/support/digital/gr3_s.html 。\n`;
  async function packageFiles(b,mode='install') {
    const hash = await digest(b), script = build(b,hash,mode);
    const files = [
      ['00-entry/00078490.609',utf8('[OPEN_FACTORY_DEBUG_MENU]\r\n')],
      ['00-entry/DEVELOP.MOD',new Uint8Array([7,1,44,31,16,3,30,22,5,45])],
      ['01-install/script/startup.ttl',utf8(script)],
      ['02-check/script/startup.ttl',utf8(check)],
      ['03-restore-backup/script/startup.ttl',utf8(restoreBackup)],
      ['04-read-only-backup/script/startup.ttl',utf8(backupOnly)],
      [p.method==='copy'?'NEWGB.JPG':'IMAGE.JPG',b], ['README.txt',utf8(mode==='install'?readme:'原图恢复包\n\n请先阅读 RESTORE_README.txt。本包使用你选择的原始备份，不重压缩。恢复操作尚未实机执行。其他文件夹是工具附带的检查功能，不要将多个脚本一起复制到卡上。\n')],['COMPATIBILITY.txt',utf8(compat)],
      ['manifest.json',utf8(JSON.stringify({model:'GR IIIx ordinary',firmware:'1.60',mode,width:W,height:H,size:SIZE,sha256:hash,scratch:'G'+hash.slice(0,7).toUpperCase()+'.JPG',core_method_camera_tested:true,consolidated_share_package_camera_tested:false,custom_image_camera_tested:false,restore_camera_tested:false},null,2)+'\n')]
    ];
    if (mode==='restore') files.push(['RESTORE_README.txt',utf8('这是用自己的原图备份生成的恢复包。启用Script后只部署01-install/script，正常开机30秒后关机。校验RESTCHK.JPG与原图备份逐字节一致，再撤脚本并关闭Script。恢复流程尚未实机执行。不要按README.txt中的新图安装说明操作。\n')]);
    return files;
  }
  const crcTable = Array.from({length:256},(_,n)=>{let c=n;for(let k=0;k<8;k++) c=c&1?0xedb88320^(c>>>1):c>>>1;return c>>>0;});
  function crc32(b) {let c=0xffffffff;for(const x of b)c=crcTable[(c^x)&255]^(c>>>8);return (c^0xffffffff)>>>0;}
  function zip(files) {
    const locals=[],centrals=[];let pos=0;
    const set=(v,p,n,size)=>size===2?v.setUint16(p,n,true):v.setUint32(p,n,true);
    for(const [name,data] of files){
      const fn=utf8(name),crc=crc32(data),local=new Uint8Array(30+fn.length),v=new DataView(local.buffer);
      set(v,0,0x04034b50,4);set(v,4,20,2);set(v,6,0x800,2);set(v,8,0,2);set(v,12,33,2);set(v,14,crc,4);set(v,18,data.length,4);set(v,22,data.length,4);set(v,26,fn.length,2);local.set(fn,30);
      const central=new Uint8Array(46+fn.length),cv=new DataView(central.buffer);
      set(cv,0,0x02014b50,4);set(cv,4,20,2);set(cv,6,20,2);set(cv,8,0x800,2);set(cv,14,33,2);set(cv,16,crc,4);set(cv,20,data.length,4);set(cv,24,data.length,4);set(cv,28,fn.length,2);set(cv,42,pos,4);central.set(fn,46);
